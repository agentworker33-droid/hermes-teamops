name: hermes-teamops
version: 0.1.0
description: "Build, run, watch, fix and grow a multi-agent team: blueprint installer + Agent Factory + Deploy Guard (preflight/smoke/rollback), fleet status + mesh view, Cron911 silent-gap detection, Model Guard, team standup digest and mesh sync."
python_dependencies:
  - "pyyaml>=6.0,<7"
provides_tools:
  - blueprint_list
  - team_deploy
  - team_verify
  - team_rollback
  - team_factory
  - team_status
  - cron_scan
  - model_scan
  - model_rollback
  - team_standup
  - mesh_sync
  - team_dashboard
  - team_dashboard_status
  - team_dashboard_stop
  - phone_intake
  - twilio_status
provides_hooks:
  - pre_tool_call
provides_middleware: []
requires_hermes: ">=0.21.4"
