  the shipped onboard-insurance-claims.sh vertical.
roles:
- name: claims-manager
  title: Chief Claims Officer — reserves, compliance, board reports
  toolsets:
  - file
  - terminal
  - web
  - delegation
  - cronjob
  soul: souls/claims-manager.md
- name: intake-specialist
