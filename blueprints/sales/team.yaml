name: sales
version: 0.1.0
description: "Agentic Sales Team — boss + sales-dev + content-marketer + research-analyst + finance-analyst + support-lead. Pattern ported from the AutomatedAgents onboarding blueprints."
roles:
  - name: boss
    title: Orchestrator & reviewer
    soul: souls/boss.md
    toolsets: [file, terminal, web, delegation, cronjob]
  - name: sales-dev
    title: Sales pipeline & outreach
    soul: souls/sales-dev.md
    toolsets: [file, web, terminal]
  - name: content-marketer
    title: Content + campaigns
    soul: souls/content-marketer.md
    toolsets: [file, web, image_gen]
  - name: research-analyst
    title: Market + intel research
    soul: souls/research-analyst.md
    toolsets: [file, web]
  - name: finance-analyst
    title: Books, cash flow, pricing
    soul: souls/finance-analyst.md
    toolsets: [file, web, terminal]
  - name: support-lead
    title: Customer support & triage
    soul: souls/support-lead.md
    toolsets: [file, web]
shared:
  kanban: assets/kanban.json
  mesh: assets/mesh.json
